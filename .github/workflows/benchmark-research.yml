name: Benchmark Research Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: benchmark-research-queue
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_DATABASE_URL: ${{ secrets.BENCHMARK_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BENCHMARK_WORKER_MODE: external
      MAX_LLM_ITEMS_PER_RUN: "5"
      LLM_TIMEOUT_SECONDS: "60"
    steps:
      - name: Validate required settings
        shell: bash
        run: |
          if [ -z "$BENCHMARK_DATABASE_URL" ]; then
            echo "::error::Add BENCHMARK_DATABASE_URL to repository Actions secrets."
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY to repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Process next queued benchmark
        run: python -m pipeline.benchmark_worker --once --require-shared-db
