name: Daily Competitor Radar Pipeline

on:
  schedule:
    # 06:30 Europe/Istanbul. GitHub Actions schedules use UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-competitor-radar
  cancel-in-progress: false

jobs:
  collect-and-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run daily incremental collection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-3-5-haiku-latest
          MAX_LLM_ITEMS_PER_RUN: "5"
          LLM_TIMEOUT_SECONDS: "60"
        run: |
          python pipeline/run_weekly_incremental_mvp.py \
            --run-id "daily_${{ github.run_id }}" \
            --lookback-days 45

      - name: Validate Python files
        run: python -m py_compile executive_app.py pages/*.py pipeline/*.py utils/*.py

      - name: Commit pipeline outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/*.csv \
            data/*.json \
            data/weekly_operations_report_*.md

          if git diff --cached --quiet; then
            echo "No pipeline data changes to commit."
          else
            git commit -m "Update daily competitor radar data"
            git push
          fi
