services:
  - type: worker
    name: benchmark-research-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m pipeline.benchmark_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BENCHMARK_WORKER_MODE
        value: external
      - key: MAX_LLM_ITEMS_PER_RUN
        value: 5
